id = "herdr-rooms"
name = "Rooms"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Rooms where your coding agents work together. First room: a review room, where another agent reviews your session until they agree."
platforms = ["macos", "linux"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[actions]]
id = "install"
title = "Rooms: set up Claude Code and Codex again"
contexts = ["global", "workspace", "pane"]
command = ["./target/release/herdr-rooms", "install"]

[[panes]]
id = "setup"
title = "/room"
placement = "popup"
width = 80
height = 38
command = ["./target/release/herdr-rooms", "setup"]

[[panes]]
id = "room"
title = "Room"
placement = "split"
command = ["./target/release/herdr-rooms", "room"]
