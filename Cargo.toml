[package]
name = "herdr-rooms"
version = "0.1.0"
edition = "2021"
description = "Rooms where coding agents work together inside herdr; first, a review room where agents review each other until they agree"
license = "MIT"
readme = "README.md"
# A herdr plugin, built from source by herdr: not a crates.io package.
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
